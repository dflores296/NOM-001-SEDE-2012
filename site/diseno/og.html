<!doctype html>

<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Inter';

    font-weight: 100 900;
  }
  html, body { margin: 0; }
  .tarjeta {
    position: relative; width: 1200px; height: 630px; overflow: hidden;

  .velo {

  .sub { font-size: 40px; font-weight: 500; color: #e3e4e8; margin: 26px 0 0; }
  .cifras { font-size: 26px; color: #c8cad0; margin: 44px 0 0; }
  .cifras b { color: #fff; font-weight: 600; }
