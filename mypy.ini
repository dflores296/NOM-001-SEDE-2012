# Revisión de tipos de los scripts de tools/ (python3 -m mypy tools/).
#
# En modo básico, a propósito: revisa las funciones que tienen anotaciones y
# lo que se puede deducir sin ellas, pero no exige anotar todo. Cuando se
# activó (octubre de 2026) no encontró ningún error real —las pruebas y la
# huella ya los atrapan—; está para que el próximo cambio no meta uno.
#
# Más estricto (check_untyped_defs = True) da hoy 62 avisos, y ninguno es un
# error: son variables a las que mypy no les deduce el tipo. Vale activarlo
# solo como parte de un trabajo de fondo en el parser. Ver «Ronda de
# seguridad» en CONTEXTO.md.
[mypy]
python_version = 3.11
files = tools
# pymupdf no publica sus tipos.
ignore_missing_imports = True
