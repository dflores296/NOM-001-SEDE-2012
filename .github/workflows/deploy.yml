name: Publicar sitio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de extracción
        run: pip install pymupdf

      # El corpus se regenera desde el PDF en cada publicación: así el sitio
      # nunca se despega de la fuente, y si un cambio en el parser rompe algo,
      # la validación lo detiene aquí y no en producción.
      # El orden importa: build_corpus salta las zonas de página que ocupan
      # las tablas leyendo data/tablas_regiones.json, que produce build_tables.
      # Corriéndolo después, el corpus se armaba con las regiones de la corrida
      # ANTERIOR y arrastraba al texto lo que la tabla ya se había llevado: las
      # notas al pie de la 220-12 se quedaban pegadas a la NOTA del artículo.
      - name: Regenerar tablas, corpus, grafo e índice de búsqueda
        run: |
          python3 tools/build_tables.py NOM-001-SEDE-2012.pdf data/
          python3 tools/build_corpus.py NOM-001-SEDE-2012.pdf data/
          python3 tools/build_graph.py data/
          python3 tools/build_search.py data/ site/public/data/
          python3 tools/build_revision.py data/ REVISION-TABLAS.md

      - name: Verificar cobertura del parseo
        run: python3 tools/check_corpus.py data/

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
