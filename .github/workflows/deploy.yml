name: Verificar y publicar el sitio

# Se verifica en cualquier rama, para saber antes de llevar un cambio a main
# si rompe algo; solo se publica desde main.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un push nuevo a la misma rama cancela la verificación anterior de esa rama.
# La publicación lleva su propio grupo, abajo, para que una rama de trabajo
# nunca cancele una publicación de main.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de extracción
        # La versión va fijada en requirements.txt, que explica por qué. No
        # instalar aquí un paquete suelto: se despegaría de lo que corre en
        # local y en las sesiones de Claude Code.
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      # Para las pruebas en navegador (site/pruebas/navegador.mjs).
      - name: Instalar Chromium para las pruebas
        run: npx playwright install --with-deps chromium
        working-directory: site

      # Regenera todo desde el PDF, verifica, compila y compara el contenido
      # contra la huella sellada. Es el mismo script que se corre en local:
      # el orden de los pasos y por qué está explicado ahí.
      - name: Regenerar, verificar y compilar
        run: bash tools/verificar.sh

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
