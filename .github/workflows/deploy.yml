name: Verificar y publicar el sitio

# Se verifica en cualquier rama, para saber antes de llevar un cambio a main
# si rompe algo; solo se publica desde main.
on:
  push:
  workflow_dispatch:

# Las acciones van fijadas por SHA y no por etiqueta: una etiqueta (@v4) la
# puede mover quien controle el repositorio de la acción, y este workflow
# publica el sitio. El comentario dice la versión; Dependabot las mantiene al
# día (.github/dependabot.yml). Ver «Ronda de seguridad» en CONTEXTO.md.
permissions:
  contents: read
  pages: write
  id-token: write

# Un push nuevo a la misma rama cancela la verificación anterior de esa rama.
# La publicación lleva su propio grupo, abajo, para que una rama de trabajo
# nunca cancele una publicación de main.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Instalar dependencias de extracción y verificación
        # La versión va fijada en requirements.txt, que explica por qué. No
        # instalar aquí un paquete suelto: se despegaría de lo que corre en
        # local y en las sesiones de Claude Code.
        run: pip install -r requirements.txt -r requirements-dev.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      # Para las pruebas en navegador (site/pruebas/navegador.mjs).
      - name: Instalar Chromium para las pruebas
        run: npx playwright install --with-deps chromium
        working-directory: site

      # Regenera todo desde el PDF, verifica, compila y compara el contenido
      # contra la huella sellada. Es el mismo script que se corre en local:
      # el orden de los pasos y por qué está explicado ahí.
      - name: Regenerar, verificar y compilar
        run: bash tools/verificar.sh

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
